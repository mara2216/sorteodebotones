<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Elige tu destino: Un juego interactivo de azar donde eliges entre dos botones para descubrir si ganas o pierdes.">
  <title>Elige tu destino | Juego de Azar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas para animación de confeti en caso de victoria -->
  <canvas id="confetti-canvas"></canvas>

  <main class="app-container">
    <div class="card glass-effect">
      <header class="card-header">
        <span class="badge">Juego de Azar</span>
        <h1 class="main-title">Elige tu destino</h1>
        <p class="subtitle">Pon a prueba tu suerte. Selecciona uno de los dos caminos.</p>
      </header>

      <!-- Panel de botones de elección -->
      <section class="choice-section" aria-label="Botones de elección">
        <div class="buttons-grid">
          <button id="btn-yellow" class="destiny-btn btn-yellow" type="button" aria-label="Elegir botón amarillo">
            <div class="btn-glow"></div>
            <div class="btn-content">
              <span class="btn-icon" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4"/>
                  <path d="M12 2v2"/>
                  <path d="M12 20v2"/>
                  <path d="m4.93 4.93 1.41 1.41"/>
                  <path d="m17.66 17.66 1.41 1.41"/>
                  <path d="M2 12h2"/>
                  <path d="M20 12h2"/>
                  <path d="m6.34 17.66-1.41 1.41"/>
                  <path d="m19.07 4.93-1.41 1.41"/>
                </svg>
              </span>
              <span class="btn-text">Botón Amarillo</span>
              <span class="btn-hint">Destino Dorado</span>
            </div>
          </button>

          <button id="btn-blue" class="destiny-btn btn-blue" type="button" aria-label="Elegir botón azul">
            <div class="btn-glow"></div>
            <div class="btn-content">
              <span class="btn-icon" aria-hidden="true">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
              </span>
              <span class="btn-text">Botón Azul</span>
              <span class="btn-hint">Destino Zafiro</span>
            </div>
          </button>
        </div>
      </section>

      <!-- Área de resultado -->
      <section id="result-area" class="result-area hidden" aria-live="polite">
        <div id="result-card" class="result-card">
          <div id="result-icon-container" class="result-icon-container">
            <!-- Icono dinámico inyectado por JS -->
          </div>
          <h2 id="result-message" class="result-title"></h2>
          <p id="result-description" class="result-description"></p>
        </div>

        <button id="btn-reset" class="reset-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>Volver a jugar</span>
        </button>
      </section>

      <!-- Marcador de estadísticas -->
      <footer class="stats-footer">
        <div class="stat-pill">
          <span class="stat-label">Victorias</span>
          <span id="stat-wins" class="stat-value win-color">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-pill">
          <span class="stat-label">Derrotas</span>
          <span id="stat-losses" class="stat-value loss-color">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-pill">
          <span class="stat-label">Total</span>
          <span id="stat-total" class="stat-value">0</span>
        </div>
      </footer>
    </div>
  </main>

  <!-- Escenario del fondo y carretera con el autito -->
  <div class="scenery-container">
    <div class="sky-stars"></div>
    <div class="city-skyline"></div>
    <div class="highway">
      <div class="road-surface">
        <div class="road-lines"></div>
      </div>
      <!-- Autito que recorre la pantalla -->
      <div id="little-car" class="little-car" title="¡Haz clic en el autito para tocar bocina y acelerar!">
        <div class="car-wrapper">
          <!-- Luz de los faros proyectada sobre la carretera -->
          <div class="headlight-beam"></div>

          <!-- Gráfico SVG detallado del coche -->
          <svg class="car-svg" viewBox="0 0 170 70" width="130" height="54">
            <defs>
              <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ef4444" />
                <stop offset="45%" stop-color="#f59e0b" />
                <stop offset="100%" stop-color="#fbbf24" />
              </linearGradient>
              <linearGradient id="carWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#bae6fd" />
                <stop offset="100%" stop-color="#1e3a8a" />
              </linearGradient>
              <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#e2e8f0" />
                <stop offset="100%" stop-color="#64748b" />
              </linearGradient>
            </defs>

            <!-- Sombra proyectada en el asfalto -->
            <ellipse cx="85" cy="62" rx="72" ry="5.5" fill="rgba(0, 0, 0, 0.6)" />

            <!-- Carrocería deportiva estilizada -->
            <path d="M 22 52 C 16 52 14 44 20 38 C 24 32 38 28 50 26 L 70 14 C 82 12 114 12 126 26 L 148 30 C 160 34 165 42 162 50 C 158 53 150 53 148 53 Z" fill="url(#carBodyGrad)" />

            <!-- Detalle de alerón trasero -->
            <path d="M 16 34 L 28 34 L 25 38 L 18 38 Z" fill="#b91c1c" />
            <path d="M 18 38 L 20 44 L 23 44 L 22 38 Z" fill="#7f1d1d" />

            <!-- Ventanas y parabrisas -->
            <path d="M 72 16 L 108 16 L 123 26 L 72 26 Z" fill="url(#carWindowGrad)" opacity="0.9" />
            <path d="M 54 26 L 68 16 L 68 26 Z" fill="url(#carWindowGrad)" opacity="0.9" />

            <!-- Luces delanteras y traseras -->
            <polygon points="152,38 162,41 158,47 150,45" fill="#fef08a" />
            <rect x="18" y="40" width="4" height="8" rx="2" fill="#ef4444" filter="drop-shadow(-2px 0 4px #ef4444)" />

            <!-- Tubo de escape -->
            <rect x="12" y="49" width="8" height="3" rx="1.5" fill="#475569" />

            <!-- Rueda Delantera -->
            <g class="car-wheel wheel-front" transform="translate(132, 52)">
              <circle cx="0" cy="0" r="11" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
              <circle cx="0" cy="0" r="6" fill="url(#rimGrad)" />
              <line x1="-5" y1="0" x2="5" y2="0" stroke="#0f172a" stroke-width="2" />
              <line x1="0" y1="-5" x2="0" y2="5" stroke="#0f172a" stroke-width="2" />
            </g>

            <!-- Rueda Trasera -->
            <g class="car-wheel wheel-back" transform="translate(46, 52)">
              <circle cx="0" cy="0" r="11" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
              <circle cx="0" cy="0" r="6" fill="url(#rimGrad)" />
              <line x1="-5" y1="0" x2="5" y2="0" stroke="#0f172a" stroke-width="2" />
              <line x1="0" y1="-5" x2="0" y2="5" stroke="#0f172a" stroke-width="2" />
            </g>
          </svg>

          <!-- Efectos de humo/fuego de escape -->
          <div class="exhaust-particles">
            <span class="smoke p1"></span>
            <span class="smoke p2"></span>
            <span class="smoke p3"></span>
          </div>

          <!-- Bocadillo interactivo de bocina -->
          <div id="horn-bubble" class="horn-bubble">¡BEEP BEEP! 🚗💨</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
